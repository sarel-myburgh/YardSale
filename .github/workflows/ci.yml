name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag yardsale:ci .
      - name: Verify non-root, health, and read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect yardsale:ci --format '{{.Config.User}}')" = "node"
          docker run --detach --name yardsale-ci \
            --read-only --tmpfs /tmp --cap-drop=ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:3000:3000 \
            --volume yardsale-ci-data:/data yardsale:ci
          trap 'docker rm --force yardsale-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs yardsale-ci
          exit 1
