services:
  yardsale-cloud:
    build: .
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      YARDSALE_CLOUD_DATA_DIR: /data
      YARDSALE_CLOUD_BASE_DOMAIN: ${YARDSALE_CLOUD_BASE_DOMAIN:-yardsale.local}
      YARDSALE_CLOUD_RUNTIME: ${YARDSALE_CLOUD_RUNTIME:-local}
      YARDSALE_CLOUD_RUNTIME_EXECUTE: ${YARDSALE_CLOUD_RUNTIME_EXECUTE:-false}
      YARDSALE_CLOUD_WEBHOOK_SECRET: ${YARDSALE_CLOUD_WEBHOOK_SECRET:-change-me-before-production}
    volumes:
      - yardsale-cloud-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  yardsale-cloud-data:
